name = "nudge"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# Template defaults, stated so wrangler does not warn at deploy: every instance serves on its
# workers.dev hostname, and per-version preview hostnames stay off (one more origin, one more
# audience, and nothing needs them).
workers_dev = true
preview_urls = false

# This file names no tenant (docs/adr/0004). Every instance value — the allowed owners, the Discord
# and GitHub App credentials — is a Worker secret: copy .dev.vars.example to .dev.vars, fill it in,
# and load it with `bunx wrangler secret bulk --env "" .dev.vars` (docs/SETUP.md § 4). No `[vars]`
# and no top-level `routes` may appear here (src/wrangler-config.test.ts): the Worker serves on its
# workers.dev hostname, and a custom domain is attached once with `bunx wrangler deploy --domain
# <hostname>` or in the dashboard, after which deploys from this file leave it alone (A23).

# A second, throwaway instance for the self-hosting acceptance check (plan decision A13, § Validation
# and Acceptance): same code, served only on workers.dev, with no secrets at all, so its empty owner
# list refuses every repository (403) and it can never post. Deploy by hand with
# `bun run deploy:acceptance`; delete with `bunx wrangler delete --env acceptance` when done.
# `routes = []` stays as a guard: an environment INHERITS a top-level `routes`, and if one were ever
# added back above, deploying this environment without the line would offer to move the production
# custom domain onto this Worker (plan § Surprises). `src/wrangler-config.test.ts` pins it.
[env.acceptance]
name = "nudge-acceptance"
workers_dev = true
routes = []
