# The first step of a repository_dispatch handler (plan decisions A5, A14, A26, A28): finds the one
# open pull request that is still what was shown in Discord — head exactly the dispatched commit,
# head branch in this repository (never a fork), and, when the consumer says so, a given base and
# head branch — and fails the job otherwise, so a tap never acts on anything else. The lookup is
# the check: a pull request whose head moved, or was closed, has no open pull request at that
# commit. That case sets the output `stale`; a failed lookup (GitHub down, bad token) fails
# without it, so the handler reports `stale` only when it is true and `failed` otherwise.
#
# Needs no Nudge instance. Talks to GitHub with the job's own token (read access to pull requests).
name: Nudge guard
description: Stop a dispatch handler unless exactly one open pull request of this repository has the dispatched commit as its head
inputs:
  commit:
    description: The commit from the dispatch, github.event.client_payload.commit
    required: true
  base:
    description: Only match a pull request into this branch (e.g. develop); any base when empty
    required: false
    default: ""
  head:
    description: Only match a pull request from this branch (e.g. auto/sync-data); any head when empty
    required: false
    default: ""
  token:
    description: Token for the GitHub API; the job's own token by default
    required: false
    default: ${{ github.token }}
outputs:
  pull-request:
    description: The number of the open pull request whose head is the commit
    value: ${{ steps.find.outputs.number }}
  stale:
    description: "\"true\" when GitHub was asked and no open pull request (or more than one) matched; unset when the lookup itself failed, so a handler can report stale or failed"
    value: ${{ steps.find.outputs.stale }}
runs:
  using: composite
  steps:
    - name: Find the pull request at the commit
      id: find
      shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
        BASE: ${{ inputs.base }}
        HEAD_BRANCH: ${{ inputs.head }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit must be a full 40-character lowercase sha, got '$COMMIT'" >&2
          exit 1
        fi
        # Every page: a commit is rarely on many pull requests, but "exactly one" must be judged on all of them.
        # jq does the matching with --arg, so no input is ever spliced into a program.
        numbers="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
          | jq -r --arg commit "$COMMIT" --arg repo "$GITHUB_REPOSITORY" --arg base "$BASE" --arg head "$HEAD_BRANCH" \
            '.[] | select(.state == "open"
                          and .head.sha == $commit
                          and .head.repo.full_name == $repo
                          and ($base == "" or .base.ref == $base)
                          and ($head == "" or .head.ref == $head))
                 | .number' \
          | xargs)"
        count="$(wc -w <<<"$numbers" | tr -d ' ')"
        if [ "$count" != "1" ]; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "::error::expected exactly one open pull request of $GITHUB_REPOSITORY with head $COMMIT${BASE:+ into $BASE}${HEAD_BRANCH:+ from $HEAD_BRANCH}, found $count: the head moved, the pull request was closed, or the commit is on another pull request" >&2
          exit 1
        fi
        echo "number=$numbers" >> "$GITHUB_OUTPUT"
