# Guards: production. This is the only path by which the Worker at the instance hostname changes.
# It deploys `main` and refuses to when the unit tests, the type check or the lint fail. `main` is production;
# unfinished work lives on feature branches (Git-flow, per CLAUDE.md § Commit Discipline).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One production deployment at a time, in order; a newer run waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run can pick any branch in the dispatch form; production is only ever main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun run lint
      - name: Deploy the Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
