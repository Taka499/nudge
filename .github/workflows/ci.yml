# Guards: every pull request. Refuses a merge when the unit tests or the type check fail, or when
# wrangler cannot build the Worker from wrangler.toml (a dry run, no account needed).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun run deploy:check
