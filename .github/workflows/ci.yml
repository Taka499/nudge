# Guards: every pull request. Refuses a merge when the unit tests, the type check or the lint fail, or when
# wrangler cannot build the Worker from wrangler.toml (a dry run, no account needed).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run type-check
      - run: bun run lint
      - run: bun run deploy:check
